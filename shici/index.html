<style>
  .verse {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 560px; margin: 18px auto 8px;
    font: clamp(26px, 7.5vw, 38px) / 1.4 var(--kai);
  }
  .verse .ch { width: 1.15em; text-align: center; }
  .verse .punct { width: .7em; }
  .verse .line-break { flex-basis: 100%; height: 0; }
  .blank {
    width: 1.15em; height: 1.3em; padding: 0; border: 0; border-bottom: 3px solid var(--primary); background: var(--primary-soft);
    font: inherit; color: var(--primary); cursor: pointer; border-radius: 4px 4px 0 0;
  }
  .blank.active { outline: 2px dashed var(--primary); outline-offset: 2px; }
  .blank.wrong { text-decoration: line-through; }
  .blank.right { background: transparent; color: var(--text); border-bottom-color: var(--text); }
  .source { min-height: 1.6em; text-align: center; color: var(--muted); font: 18px/1.6 var(--kai); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: min(92vw, 400px); margin: 14px auto; }
  .tiles button {
    aspect-ratio: 1; border: 2px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer;
    font: clamp(26px, 8vw, 34px) / 1 var(--kai);
  }
  .tiles button:disabled { opacity: .3; }
  .progress { display: flex; justify-content: center; gap: 8px; margin: 2px 0 6px; }
  .progress i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
  .progress i.done { background: var(--primary); border-color: var(--primary); }
  .progress i.skip { background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 4px); }
  .progress i.now { outline: 2px solid var(--text); outline-offset: 2px; }
  [data-ink] .blank { background: #FFF; border-bottom: 4px solid #000; color: #000; }
  [data-ink] .blank.active { outline: 3px solid #000; }
  [data-ink] .blank.right { border-bottom: 2px solid #000; }
  [data-ink] .tiles button { border-color: #000; }
  [data-ink] .progress i { border-color: #000; }
  [data-ink] .progress i.done { background: #000; }
  [data-ink] .progress i.skip { background: repeating-linear-gradient(45deg, #000 0 2px, #FFF 2px 4px); }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="back" href="/games/">← 游戏园</a>
    <h1>诗词填字</h1>
    <button type="button" class="btn small rules-btn">规则</button>
  </header>
  <div class="panel">
    <div class="row"><span class="label">题目</span><div class="seg" id="mode"></div></div>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="verse" id="verse"></div>
  <p class="source" id="source"></p>
  <div class="tiles" id="tiles" aria-label="可选的字"></div>
  <div class="actions">
    <button type="button" class="btn" id="hint">提示一个字</button>
    <button type="button" class="btn primary" id="next">下一句</button>
  </div>
  <p class="sub" id="sub"></p>
  <p class="foot"><a href="/games/">游戏园</a></p>
</div>

<dialog class="rules" id="rules" aria-labelledby="rules-title">
  <div class="inner">
    <h2 id="rules-title">诗词填字怎么玩</h2>
    <p>每题是一句古诗名句，里面<strong>空了两个字</strong>。从下面八个字里挑出正确的，填进空格。</p>
    <h3>怎么填</h3>
    <ul>
      <li>点下面的字，它会填进框着虚线的那个空格。</li>
      <li>填错了点一下那个空格，字就退回去，可以重选。</li>
      <li>两个空都填好后自动判对错。答对会显示这句诗出自哪首诗、谁写的。</li>
      <li>想不起来可以点「提示一个字」，会替你填对一个空。</li>
    </ul>
    <h3>题目</h3>
    <p><strong>每日五句</strong>每天北京时间零点换，所有人一样。<strong>练习</strong>可以一直做下去。题库是小学到中学最常背的唐诗宋词名句。</p>
    <div class="close-row"><button type="button" class="btn primary close">知道了</button></div>
  </div>
</dialog>

<script src="/shici/poems.js"></script>
<script src="/games/kit/kit.js?v=5"></script>
<script>
  const { el, store, toast, seeded, shuffle, today } = Kit;
  const $ = id => document.getElementById(id);
  const PUNCT = /[，。、！？；：]/;
  const ALL_CHARS = [...new Set(POEMS.flatMap(([text]) => [...text].filter(ch => !PUNCT.test(ch))))];

  // 一道题：哪一句、空哪两个字、八个备选字
  function makeQuestion(random) {
    const index = Math.floor(random() * POEMS.length);
    const [text] = POEMS[index];
    const spots = [...text].map((ch, i) => (PUNCT.test(ch) ? -1 : i)).filter(i => i >= 0);
    const [a, b] = shuffle([...spots], random).slice(0, 2).sort((x, y) => x - y);
    const answers = [text[a], text[b]];
    const pool = shuffle(ALL_CHARS.filter(ch => !answers.includes(ch)), random).slice(0, 6);
    return { index, blanks: [a, b], tiles: shuffle([...answers, ...pool], random) };
  }

  let mode = store.get('shici:mode', 'daily');
  let daily = null;
  let q = null; // { index, blanks, tiles, filled: [tileIndex|null, ...], done, revealed, mistakes }
  let streak = store.get('shici:streak', 0);

  function loadDaily() {
    const date = today();
    const saved = store.get('shici:daily', null);
    if (saved && saved.date === date) return saved;
    const random = seeded(`shici-${date}`);
    const used = new Set();
    const questions = [];
    while (questions.length < 5) {
      const question = makeQuestion(random);
      if (used.has(question.index)) continue;
      used.add(question.index);
      questions.push(question);
    }
    return { date, questions, results: ['', '', '', '', ''], index: 0 };
  }

  function start(question) {
    q = { ...question, filled: [null, null], done: false, hinted: 0 };
    draw();
  }

  function startMode() {
    if (mode === 'daily') {
      daily = loadDaily();
      const i = daily.results.findIndex(r => !r);
      daily.index = i < 0 ? 4 : i;
      start(daily.questions[daily.index]);
      if (i < 0) q.done = true;
      draw();
    } else {
      start(makeQuestion(Math.random));
    }
  }

  function draw() {
    const [text, title, author] = POEMS[q.index];
    const active = q.filled.findIndex(f => f === null);
    const commas = [...text].map((ch, i) => (ch === '，' ? i : -1)).filter(i => i >= 0);
    const breakAt = commas.sort((a, b) => Math.abs(a - text.length / 2) - Math.abs(b - text.length / 2))[0];
    const nodes = [];
    [...text].forEach((ch, i) => {
      const slot = q.blanks.indexOf(i);
      if (slot >= 0) {
        const filled = q.filled[slot];
        const button = el('button', {
          type: 'button',
          className: `blank${slot === active && !q.done ? ' active' : ''}${q.done ? ' right' : ''}`,
          text: q.done ? ch : filled !== null ? q.tiles[filled] : '',
          'aria-label': filled !== null || q.done ? `空格 ${slot + 1}：${q.done ? ch : q.tiles[filled]}，点一下退回` : `空格 ${slot + 1}`,
        });
        button.addEventListener('click', () => {
          if (q.done || q.filled[slot] === null) return;
          q.filled[slot] = null;
          draw();
        });
        nodes.push(button);
      } else {
        nodes.push(el('span', { className: PUNCT.test(ch) ? 'ch punct' : 'ch', text: ch }));
        // 在最靠近中间的逗号后面换行，上下两句对齐
        if (i === breakAt) nodes.push(el('span', { className: 'line-break' }));
      }
    });
    $('verse').replaceChildren(...nodes);
    $('source').textContent = q.done ? `—— ${author}《${title}》` : '';
    $('tiles').replaceChildren(...q.tiles.map((ch, i) => {
      const button = el('button', { type: 'button', text: ch });
      button.disabled = q.done || q.filled.includes(i);
      button.addEventListener('click', () => place(i));
      return button;
    }));
    $('hint').disabled = q.done;
    if (mode === 'daily') {
      const done = daily.results.filter(r => r === 'done').length;
      $('progress').hidden = false;
      $('progress').replaceChildren(...daily.results.map((r, i) => el('i', { className: `${r}${i === daily.index ? ' now' : ''}` })));
      const finished = daily.results.every(r => r);
      $('status').textContent = finished ? `今天的五句做完了：答对 ${done} 句` : `每日第 ${daily.index + 1} 句 · ${daily.date}`;
      $('next').textContent = finished ? '再练几句' : '下一句';
      $('sub').textContent = finished ? '明天零点换新题。' : '';
    } else {
      $('progress').hidden = true;
      $('status').textContent = q.done ? '答对了！' : '把空着的字填上';
      $('next').textContent = q.done ? '下一句' : '换一句';
      $('sub').textContent = streak ? `连续答对 ${streak} 句` : '';
    }
  }

  function place(i) {
    if (q.done) return;
    const slot = q.filled.findIndex(f => f === null);
    if (slot < 0) return;
    q.filled[slot] = i;
    if (q.filled.every(f => f !== null)) {
      const [text] = POEMS[q.index];
      const right = q.blanks.every((pos, k) => q.tiles[q.filled[k]] === text[pos]);
      if (right) return finish(q.hinted ? 'skip' : 'done');
      toast('不对哦，点空格把字退回去再试试');
    }
    draw();
  }

  function finish(result) {
    q.done = true;
    if (mode === 'daily') {
      if (!daily.results[daily.index]) daily.results[daily.index] = result;
      store.set('shici:daily', daily);
    } else {
      streak = result === 'done' ? streak + 1 : 0;
      store.set('shici:streak', streak);
    }
    toast(result === 'done' ? '答对了！' : '填好了');
    draw();
  }

  $('hint').addEventListener('click', () => {
    const [text] = POEMS[q.index];
    // 先把填错的退回，再填对一个空
    q.blanks.forEach((pos, k) => {
      if (q.filled[k] !== null && q.tiles[q.filled[k]] !== text[pos]) q.filled[k] = null;
    });
    const slot = q.filled.findIndex(f => f === null);
    if (slot < 0) return;
    const want = text[q.blanks[slot]];
    q.filled[slot] = q.tiles.findIndex((ch, i) => ch === want && !q.filled.includes(i));
    q.hinted++;
    if (q.filled.every(f => f !== null)) return finish('skip');
    draw();
  });

  $('next').addEventListener('click', () => {
    if (mode === 'daily') {
      if (!q.done && !daily.results[daily.index]) {
        if (!confirm('跳过这一句？')) return;
        daily.results[daily.index] = 'skip';
        store.set('shici:daily', daily);
      }
      const i = daily.results.findIndex(r => !r);
      if (i < 0) return setMode('practice');
      daily.index = i;
      start(daily.questions[i]);
    } else {
      if (!q.done) {
        streak = 0;
        store.set('shici:streak', streak);
      }
      start(makeQuestion(Math.random));
    }
  });

  const MODES = [['daily', '每日五句'], ['practice', '练习']];
  function setMode(value) {
    mode = value;
    store.set('shici:mode', mode);
    $('mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    startMode();
  }
  MODES.forEach(([value, label]) => {
    const button = el('button', { type: 'button', 'aria-pressed': String(value === mode), text: label, 'data-mode': value });
    button.addEventListener('click', () => setMode(value));
    $('mode').append(button);
  });

  Kit.setupRules('shici');
  startMode();
</script>
</body>
</html>
