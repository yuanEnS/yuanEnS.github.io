<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="/life/kindle.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活园</title>
<meta name="description" content="生活园：写写日常，也写写想法。">
<meta property="og:type" content="article">
<meta property="og:site_name" content="游戏园">
<meta property="og:image" content="https://gamesyuan.com/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="gamesyuan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="/pwa.js" defer></script>
<meta name="theme-color" content="#FBF6EE">
<link rel="stylesheet" href="/life/fonts/kai.css">
<link rel="stylesheet" href="/life/life.css">
</head>
<body>
<div class="page">
<nav class="top"><a href="/life/world/">← 世界园</a><a id="edit" hidden>修改</a></nav>
<article id="article" hidden>
  <header class="head">
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
  </header>
  <div class="body" id="body"></div>
  <p class="end"><span class="seal" aria-hidden="true">记</span></p>
  <p class="rights" id="rights" hidden></p>
</article>
<p class="empty" id="status" role="status">正在打开…</p>
<nav class="pager" id="pager" hidden></nav>
<!-- 评论不进搜索结果的摘要 -->
<section class="comments" id="comments" data-nosnippet hidden></section>
<footer class="foot"><a href="/life/">生活园</a> · <a href="/">首页</a> · <a href="https://api.gamesyuan.com/life/lite">Kindle 版</a></footer>
</div>
<script src="/life/life.js"></script>
<script src="/life/comments.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id');

  function pagerLink(post, label, className) {
    const link = document.createElement('a');
    link.className = className;
    link.href = `/life/post/?id=${post.id}`;
    const small = document.createElement('small');
    small.textContent = label;
    link.append(small, post.title);
    return link;
  }

  const RIGHTS = {
    credit: author => `本文为${author}原创，转载请注明作者和出处：`,
    ask: author => `本文为${author}原创，未经作者同意，请勿转载。`,
  };

  function showRights(post) {
    const line = RIGHTS[post.rights];
    $('rights').hidden = !line;
    if (!line) return;
    $('rights').textContent = line(post.author);
    if (post.rights === 'credit') {
      const link = document.createElement('a');
      link.href = `https://gamesyuan.com/life/post/?id=${post.id}`;
      link.textContent = `gamesyuan.com/life/post/?id=${post.id}`;
      $('rights').append(link);
    }
  }

  function show({ post, newer, older }) {
    const url = `https://gamesyuan.com/life/post/?id=${post.id}`;
    const summary = excerpt(post.body, 110) || post.title;
    setMeta({
      title: `${post.title} | 生活园`,
      description: summary,
      canonical: url,
      // 草稿和仅自己可见的文章不进搜索结果（路人本来也打不开）
      noindex: !!(post.draft || post.hidden),
      data: post.draft || post.hidden ? null : {
        '@context': 'https://schema.org',
        '@type': 'BlogPosting',
        headline: post.title,
        description: summary,
        datePublished: post.date,
        inLanguage: 'zh-CN',
        url,
        mainEntityOfPage: url,
        author: { '@type': 'Person', name: post.author, url: `https://gamesyuan.com${authorUrl(post.author)}` },
        publisher: { '@type': 'Organization', name: 'gamesyuan', url: 'https://gamesyuan.com/' },
        keywords: post.tags.split(/\s+/).filter(Boolean).join(','),
      },
    });
    $('title').textContent = post.title;
    const parts = [cnDate(post.date), ...post.tags.split(/\s+/).filter(Boolean)];
    if (post.draft) parts.push('草稿');
    else if (post.hidden) parts.push('仅自己可见');
    const author = document.createElement('a');
    author.href = authorUrl(post.author);
    author.textContent = post.author;
    const byline = document.createElement('span');
    byline.append(author);
    $('meta').replaceChildren(byline, ...parts.map(text => {
      const span = document.createElement('span');
      span.textContent = text;
      return span;
    }));
    $('body').innerHTML = renderBody(post.body);
    renderMath($('body'));
    showRights(post);
    const links = [];
    if (older) links.push(pagerLink(older, '上一篇', 'prev'));
    if (newer) links.push(pagerLink(newer, '下一篇', 'next'));
    $('pager').replaceChildren(...links);
    $('pager').hidden = !links.length;
    $('edit').hidden = !post.canEdit;
    $('article').hidden = false;
    $('status').hidden = true;
    // 草稿和仅自己可见的文章没有评论
    if (!post.draft && !post.hidden) mountComments($('comments'), post.id);
  }

  api(`/life/post?id=${encodeURIComponent(id)}`).then(show).catch(err => {
    setMeta({ noindex: true });
    $('status').textContent = errorText(err);
  });

  $('edit').href = `/life/write/?id=${encodeURIComponent(id)}`;
</script>
</body>
</html>
