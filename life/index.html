<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>园中小记 | 游戏园</title>
<meta name="description" content="园中小记：写写日常，也写写想法。">
<link rel="canonical" href="https://gamesyuan.com/life/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="游戏园">
<meta property="og:title" content="园中小记">
<meta property="og:description" content="写写日常，也写写想法。">
<meta property="og:url" content="https://gamesyuan.com/life/">
<meta property="og:image" content="https://gamesyuan.com/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FBF6EE">
<link rel="stylesheet" href="/life/fonts/kai.css">
<link rel="stylesheet" href="/life/life.css">
</head>
<body>
<div class="page">
<nav class="top"><a href="/">← 游戏园</a><a id="write" href="/life/write/" hidden>写文章</a></nav>
<header class="masthead">
  <span class="seal" aria-hidden="true">记</span>
  <h1>园中小记</h1>
  <p>写写日常，也写写想法。</p>
</header>
<main id="list"><p class="empty" role="status">正在打开…</p></main>
<footer class="foot"><a href="/">游戏园</a></footer>
</div>
<script src="/life/life.js"></script>
<script>
  const list = document.getElementById('list');

  function entry(post) {
    const article = document.createElement('article');
    article.className = 'entry';
    const time = document.createElement('time');
    time.dateTime = post.date;
    time.textContent = dateParts(post.date).monthDay;
    const title = document.createElement('h2');
    const link = document.createElement('a');
    link.href = `/life/post/?id=${post.id}`;
    link.textContent = post.title;
    title.append(link);
    const summary = document.createElement('p');
    summary.textContent = excerpt(post.head);
    article.append(time, title, summary);
    return article;
  }

  function message(text) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = text;
    list.replaceChildren(p);
  }

  api('/life/posts').then(({ list: posts }) => {
    if (!posts.length) return message('还没有文章。');
    const nodes = [];
    let year = null;
    for (const post of posts) {
      const y = dateParts(post.date).year;
      if (y !== year) {
        year = y;
        const heading = document.createElement('h2');
        heading.className = 'year';
        heading.textContent = cnYear(y);
        nodes.push(heading);
      }
      nodes.push(entry(post));
    }
    list.replaceChildren(...nodes);
  }).catch(err => message(errorText(err)));

  showAuthorLink(document.getElementById('write'));
</script>
</body>
</html>
