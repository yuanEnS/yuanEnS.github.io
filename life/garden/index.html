<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>园地 | 生活园</title>
<meta name="description" content="私人园里的一块园地：心愿单、旅行地图、纪念日或自己起名的园地，可以和朋友一起写。">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="gamesyuan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="/pwa.js" defer></script>
<meta name="theme-color" content="#FBF6EE">
<link rel="stylesheet" href="/life/fonts/kai.css">
<link rel="stylesheet" href="/life/life.css">
</head>
<body>
<div class="page">
<nav class="top"><a id="back" href="/life/personal/">← 私人园</a><span id="badge"></span></nav>
<p class="empty" id="status" role="status">正在打开…</p>

<main id="garden" hidden>
  <header class="masthead garden-head">
    <span class="seal" id="seal" aria-hidden="true">园</span>
    <p class="crumbs" id="crumbs" hidden></p>
    <h1 id="title"></h1>
    <p id="intro"></p>
    <p class="meta" id="people"></p>
  </header>

  <div class="invite-bar" id="invite-bar" hidden>
    <p id="invite-text"></p>
    <div class="buttons">
      <button class="primary" type="button" id="accept">答应，一起写</button>
      <button type="button" id="decline">不了</button>
    </div>
  </div>

  <section class="globe-wrap" id="map-wrap" hidden aria-label="旅行地图">
    <div class="globe trip-map" id="map"></div>
    <p class="hint" id="map-hint"></p>
  </section>

  <p class="progress" id="progress" hidden></p>
  <div id="items"></div>

  <section class="children" id="children-wrap" hidden aria-labelledby="children-title">
    <h2 class="section-title" id="children-title">园中园</h2>
    <div class="garden-grid" id="children"></div>
    <details class="new-garden" id="new-child" hidden>
      <summary>在这里开一块小园地</summary>
      <form id="child-form">
        <fieldset class="kind-pick">
          <legend>种什么</legend>
          <label><input type="radio" name="child-kind" value="notes" checked><b>其他</b><small>自己起名，写文章、随笔</small></label>
          <label><input type="radio" name="child-kind" value="wish"><b>心愿单</b><small>想做的事，一件件勾掉</small></label>
          <label><input type="radio" name="child-kind" value="travel"><b>旅行地图</b><small>标出去过的地方，写旅行故事</small></label>
          <label><input type="radio" name="child-kind" value="dates"><b>纪念日</b><small>记住重要的日子</small></label>
        </fieldset>
        <input class="field" id="child-title" maxlength="40" placeholder="起个名字，比如：2024 欧洲" aria-label="小园地的名字" autocomplete="off" required>
        <p class="note" id="child-message" role="status"></p>
        <div class="buttons"><button class="primary" type="submit">开小园地</button></div>
        <p class="hint" id="child-hint"></p>
      </form>
    </details>
  </section>

  <form class="item-form" id="item-form" hidden>
    <h2 class="year" id="form-title">添一条</h2>
    <div class="place-search" id="place-search" hidden>
      <div class="search-row">
        <input class="field" id="place-q" maxlength="60" placeholder="搜城市或地点，比如：丽江、Kiruna" aria-label="搜索城市或地点" autocomplete="off" enterkeyhint="search">
        <button type="button" id="place-go">搜索</button>
      </div>
      <div class="place-results" id="place-results" role="list"></div>
      <p class="hint">搜不到就在上面的地图上点一下。外国地名用英文搜更准。地点数据 © OpenStreetMap。</p>
    </div>
    <input class="field" id="item-title" maxlength="100" autocomplete="off">
    <div class="field-row">
      <label id="date-label">日期 <input class="field" id="item-date" type="date"></label>
      <label class="check" id="done-wrap" hidden><input type="checkbox" id="item-done"> 已经实现了</label>
      <p class="hint" id="pick-text" hidden></p>
    </div>
    <textarea class="field" id="item-body" rows="5" maxlength="5000"></textarea>
    <p class="note" id="item-message" role="status"></p>
    <div class="buttons">
      <button class="primary" type="submit" id="item-save">保存</button>
      <button type="button" id="item-cancel" hidden>不改了</button>
      <button type="button" class="danger" id="item-delete" hidden>删除这一条</button>
    </div>
  </form>

  <details class="settings" id="settings" hidden>
    <summary>园地设置</summary>
    <form id="garden-form">
      <input class="field" id="garden-title" maxlength="40" aria-label="园地名字" autocomplete="off">
      <textarea class="field" id="garden-intro" rows="2" maxlength="300" placeholder="一句介绍（可不填）" aria-label="介绍"></textarea>
      <label class="check" id="public-wrap"><input type="checkbox" id="garden-public"> 公开，所有人都能看到，会出现在我的私人园里</label>
      <p class="hint" id="nested-hint" hidden></p>
      <div class="buttons"><button class="primary" type="submit">保存设置</button></div>
    </form>
    <div id="people-settings">
      <h3>一起写的人</h3>
      <div id="members"></div>
      <form class="invite-form" id="invite-form">
        <input class="field" id="invite-name" maxlength="12" placeholder="对方的昵称" aria-label="邀请的昵称" autocomplete="off">
        <button type="submit">邀请</button>
      </form>
      <p class="hint">对方在自己的私人园里答应后，就能添加和修改条目，也能开小园地。一起写的人只能删自己写的条目和自己开的小园地，你都能删。里面的小园地也跟着这里的设置。</p>
    </div>
    <p class="note" id="settings-message" role="status"></p>
    <div class="buttons"><button type="button" class="danger" id="garden-delete">删除整块园地</button></div>
  </details>

  <div class="buttons leave" id="leave-wrap" hidden><button type="button" id="leave">退出这块园地</button></div>
</main>

<footer class="foot"><a href="/life/">生活园</a> · <a href="/life/personal/">私人园</a></footer>
</div>
<script src="/life/life.js"></script>
<script src="/life/land.js"></script>
<script src="/life/garden-map.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const gardenId = new URLSearchParams(location.search).get('id');
  const KIND = {
    wish: {
      seal: '愿', add: '许个心愿', title: '想做的事', date: '实现的日子', body: '为什么想做、想和谁一起（可不填）',
      empty: '还没有心愿。',
    },
    travel: {
      seal: '行', add: '记一个地方', title: '地方，比如：京都', date: '去的日子', body: '旅行故事。空一行就是新的一段。',
      empty: '还没有去过的地方。',
    },
    dates: {
      seal: '念', add: '记一个日子', title: '比如：第一次见面', date: '日期', body: '写几句（可不填）',
      empty: '还没有纪念日。',
    },
    notes: {
      seal: '记', add: '写一篇', title: '标题', date: '日期（可不填）', body: '正文。空一行就是新的一段。',
      empty: '还没有文章。', name: '其他',
    },
  };
  const KIND_NAME = { wish: '心愿单', travel: '旅行地图', dates: '纪念日', notes: '' };

  let data = null; // 接口返回的 { garden, members, items }
  let editing = null; // 正在改的条目
  let picked = null; // 旅行地图上选中的地方
  let map = null;
  let pickedLabel = ''; // 搜索选中的地方的全名
  const openStories = new Set(); // 展开了的旅行故事，保存后重画时保持展开

  const canWrite = () => ['owner', 'member'].includes(data.garden.role);
  const kind = () => KIND[data.garden.kind];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function today() {
    const now = new Date();
    return new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  function dayNumber(date) {
    const [y, m, d] = date.split('-').map(Number);
    return Date.UTC(y, m - 1, d) / 86400000;
  }

  // 下一个周年：今年的这一天过了就算明年的。2 月 29 日在平年算 3 月 1 日
  function nextAnniversary(date) {
    const [, m, d] = date.split('-').map(Number);
    const now = today();
    let year = Number(now.slice(0, 4));
    const at = y => new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10);
    if (at(year) < now) year++;
    const next = at(year);
    return { days: dayNumber(next) - dayNumber(now), years: year - Number(date.slice(0, 4)) };
  }

  function byline(item) {
    const parts = [];
    if (item.author) parts.push(item.author);
    return parts.join(' · ');
  }

  function editButton(item) {
    if (!canWrite()) return null;
    const button = el('button', 'link-button', '修改');
    button.type = 'button';
    button.addEventListener('click', () => startEdit(item));
    return button;
  }

  // ---------- 三种园地的样子 ----------

  function showWish(items) {
    const done = items.filter(item => item.done).length;
    $('progress').hidden = !items.length;
    $('progress').textContent = `已经实现 ${done} / ${items.length}`;
    // 没实现的在前面
    const sorted = [...items].sort((a, b) => a.done - b.done || a.id - b.id);
    return sorted.map(item => {
      const row = el('div', `wish${item.done ? ' done' : ''}`);
      const box = el('input');
      box.type = 'checkbox';
      box.checked = !!item.done;
      box.disabled = !canWrite();
      box.setAttribute('aria-label', `${item.title}，${item.done ? '已实现' : '没实现'}`);
      box.addEventListener('change', async () => {
        box.disabled = true;
        try {
          await api('/garden/item', {
            garden: data.garden.id, id: item.id, title: item.title, body: item.body,
            date: box.checked && !item.date ? today() : item.date, done: box.checked,
          });
          await load();
        } catch (err) {
          box.checked = !box.checked;
          box.disabled = false;
          alert(errorText(err));
        }
      });
      const text = el('div', 'wish-text');
      text.append(el('strong', '', item.title));
      if (item.body) text.append(el('p', '', item.body));
      const meta = [byline(item)];
      if (item.done && item.date) meta.push(`${cnDate(item.date)}实现`);
      text.append(el('small', '', meta.filter(Boolean).join(' · ')));
      row.append(box, text);
      const edit = editButton(item);
      if (edit) row.append(edit);
      return row;
    });
  }

  function ensureMap() {
    if (map) return map;
    map = gardenMap($('map'), {
      onPin: item => {
        const article = document.getElementById(`item-${item.id}`);
        if (!article) return;
        if (article.expand) article.expand();
        article.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
      onPick: (lat, lon) => {
        picked = { lat, lon };
        pickedLabel = '';
        showPick();
      },
    });
    return map;
  }

  // 新的在前面，没填日期的放最后
  const newestFirst = items => [...items].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id - a.id);

  function showTravel(items) {
    $('map-wrap').hidden = false;
    ensureMap().setPins(items);
    $('map-hint').textContent = items.length
      ? `去过 ${items.length} 个地方。点地图上的红点，打开那段故事。`
      : '';
    return newestFirst(items).map(story);
  }

  function showNotes(items) {
    return newestFirst(items).map(story);
  }

  // 一行标题 + 开头一句，点开读全文。旅行故事和「其他」园地的文章都这样
  function story(item) {
    {
      const article = el('article', 'entry trip');
      article.id = `item-${item.id}`;
      const time = el('time', '', [item.date ? cnDate(item.date) : '', byline(item)].filter(Boolean).join(' · '));
      if (item.date) time.dateTime = item.date;
      const title = el('h2');
      const open = el('button', 'trip-title', item.title);
      open.type = 'button';
      title.append(open);
      article.append(time, title);
      const actions = el('div', 'trip-actions');
      // 平时只露出开头一句，后面还有内容的才能点标题或「读全文」展开
      let head = item.body ? excerpt(item.body, 60) : '';
      const more = item.body && (head.endsWith('…') || item.body.trim().split(/\n\s*\n/).length > 1 || !head);
      if (more && head && !head.endsWith('…')) head += '…';
      if (item.body && !more) {
        article.append(el('p', 'trip-summary', head));
        open.disabled = true;
      } else if (item.body) {
        const summary = el('p', 'trip-summary', head);
        const body = el('div', 'body');
        body.id = `story-${item.id}`;
        const toggle = el('button', 'link-button', '');
        toggle.type = 'button';
        const show = expanded => {
          if (expanded) openStories.add(item.id);
          else openStories.delete(item.id);
          if (expanded && !body.innerHTML) {
            body.innerHTML = renderBody(item.body);
            renderMath(body);
          }
          body.hidden = !expanded;
          summary.hidden = expanded || !summary.textContent;
          toggle.textContent = expanded ? '收起' : '读全文';
          open.setAttribute('aria-expanded', String(expanded));
          toggle.setAttribute('aria-expanded', String(expanded));
        };
        open.setAttribute('aria-controls', body.id);
        toggle.setAttribute('aria-controls', body.id);
        open.addEventListener('click', () => show(body.hidden));
        toggle.addEventListener('click', () => show(body.hidden));
        article.expand = () => show(true);
        body.hidden = true;
        article.append(summary, body);
        actions.append(toggle);
        show(openStories.has(item.id));
      } else {
        open.disabled = true;
      }
      const edit = editButton(item);
      if (edit) actions.append(edit);
      if (actions.childNodes.length) article.append(actions);
      return article;
    }
  }

  function showDates(items) {
    const now = today();
    const rows = items.map(item => ({ item, next: nextAnniversary(item.date) }));
    // 将来的日子按还有几天排在前面，过去的按下一个周年排
    rows.sort((a, b) => {
      const da = a.item.date > now ? dayNumber(a.item.date) - dayNumber(now) : a.next.days;
      const db = b.item.date > now ? dayNumber(b.item.date) - dayNumber(now) : b.next.days;
      return da - db;
    });
    return rows.map(({ item, next }) => {
      const card = el('div', 'date-card');
      const big = el('p', 'date-count');
      const small = el('p', 'date-next');
      const gap = dayNumber(now) - dayNumber(item.date);
      if (gap < 0) {
        big.append('还有 ', el('b', '', String(-gap)), ' 天');
        small.textContent = cnDate(item.date);
      } else if (gap === 0) {
        big.append(el('b', '', '就是今天'));
        small.textContent = cnDate(item.date);
      } else {
        big.append('已经 ', el('b', '', String(gap)), ' 天');
        small.textContent = next.days === 0
          ? `今天是 ${next.years} 周年`
          : `${cnDate(item.date)} · ${next.years} 周年还有 ${next.days} 天`;
      }
      card.append(el('h2', '', item.title), big, small);
      if (item.body) card.append(el('p', 'date-note', item.body));
      const foot = el('div', 'date-foot');
      foot.append(el('small', '', byline(item)));
      const edit = editButton(item);
      if (edit) foot.append(edit);
      card.append(foot);
      return card;
    });
  }

  // ---------- 表单 ----------

  function resetForm() {
    editing = null;
    picked = null;
    pickedLabel = '';
    if (map) map.setPick(null);
    $('place-q').value = '';
    $('place-results').replaceChildren();
    $('item-title').value = '';
    $('item-body').value = '';
    $('item-date').value = data.garden.kind === 'dates' ? today() : '';
    $('item-done').checked = false;
    $('form-title').textContent = kind().add;
    $('item-cancel').hidden = true;
    $('item-delete').hidden = true;
    $('item-message').textContent = '';
    showPick();
  }

  function showPick() {
    if (data.garden.kind !== 'travel') return;
    $('pick-text').textContent = picked
      ? `${pickedLabel ? `已选：${pickedLabel}。` : '已选好地方，地图上的红圈就是。'}点地图别处可以改。`
      : '搜一下，或者在上面的地图上点一下，选出这个地方。';
  }

  function startEdit(item) {
    editing = item;
    $('item-title').value = item.title;
    $('item-body').value = item.body;
    $('item-date').value = item.date;
    $('item-done').checked = !!item.done;
    $('form-title').textContent = '修改';
    $('item-cancel').hidden = false;
    $('item-delete').hidden = !(item.mine || data.garden.role === 'owner');
    $('item-message').textContent = '';
    if (data.garden.kind === 'travel') {
      picked = { lat: item.lat, lon: item.lon };
      pickedLabel = '';
      map.setPick(item.lat, item.lon);
      showPick();
    }
    $('item-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('item-title').focus({ preventScroll: true });
  }

  // ---------- 整页 ----------

  function showHead() {
    const { garden, members, path } = data;
    document.title = `${garden.title} | 生活园`;
    // 小园地：上面显示从最外面一层层进来的路
    $('crumbs').hidden = !path.length;
    $('crumbs').replaceChildren(...path.flatMap((step, i) => {
      const link = el('a', '', step.title);
      link.href = `/life/garden/?id=${step.id}`;
      return i ? [' › ', link] : [link];
    }), path.length ? ' ›' : '');
    $('title').textContent = garden.title;
    $('intro').textContent = garden.intro;
    $('intro').hidden = !garden.intro;
    $('seal').textContent = kind().seal;
    $('badge').textContent = garden.public ? '公开' : '只有一起写的人能看';
    const mine = garden.role === 'owner';
    const parent = path[path.length - 1];
    if (parent) {
      $('back').href = `/life/garden/?id=${parent.id}`;
      $('back').textContent = `← ${parent.title}`;
    } else {
      $('back').href = mine || garden.role === 'member' ? '/life/personal/' : authorUrl(garden.owner);
      $('back').textContent = mine || garden.role === 'member' ? '← 我的私人园' : `← ${garden.owner}的园子`;
    }
    const joined = members.filter(m => m.joined).map(m => m.name);
    const owner = el('a', '', garden.owner);
    owner.href = authorUrl(garden.owner);
    $('people').replaceChildren('主人 ', owner, joined.length ? ` · 一起写：${joined.join('、')}` : '');

    $('invite-bar').hidden = garden.role !== 'invited';
    $('invite-text').textContent = `${garden.owner}邀请你一起写这块园地。`;
    $('item-form').hidden = !canWrite();
    // 最外面的园地只有主人能设置；小园地一起写的人都能改名字
    $('settings').hidden = path.length ? !canWrite() : !mine;
    $('leave-wrap').hidden = garden.role !== 'member' || !!path.length;
  }

  function childCard(child) {
    const card = el('a', 'garden-card');
    card.href = `/life/garden/?id=${child.id}`;
    const seal = el('span', 'seal', KIND[child.kind].seal);
    seal.setAttribute('aria-hidden', 'true');
    const parts = [];
    if (KIND_NAME[child.kind]) parts.push(KIND_NAME[child.kind]);
    parts.push(`${child.items} ${child.kind === 'notes' ? '篇' : '条'}`);
    if (child.children) parts.push(`${child.children} 块小园地`);
    const text = el('span');
    text.append(el('strong', '', child.title), el('small', '', parts.join(' · ')));
    card.append(seal, text);
    return card;
  }

  function showChildren() {
    const { garden, children } = data;
    const canAdd = canWrite() && garden.canNest;
    $('children-wrap').hidden = !children.length && !canAdd;
    $('children').replaceChildren(...children.map(childCard));
    $('children').hidden = !children.length;
    $('new-child').hidden = !canAdd;
    $('child-hint').textContent = `小园地跟着「${data.path.length ? data.path[0].title : garden.title}」：一起写的人一样，${garden.public ? '一样公开' : '一样不公开'}。园中园最多三层。`;
  }

  function showSettings() {
    const { garden, members, path } = data;
    $('garden-title').value = garden.title;
    $('garden-intro').value = garden.intro;
    $('garden-public').checked = !!garden.public;
    const nested = !!path.length;
    $('public-wrap').hidden = nested;
    $('people-settings').hidden = nested;
    $('nested-hint').hidden = !nested;
    $('nested-hint').textContent = nested ? `公开与否、一起写的人，都在最外面的「${path[0].title}」里设置。` : '';
    $('garden-delete').hidden = !(garden.role === 'owner' || garden.created);
    $('members').replaceChildren(...(members.length ? members.map(member => {
      const row = el('div', 'member');
      row.append(el('span', '', member.name), el('small', '', member.joined ? '一起写' : '等对方答应'));
      const out = el('button', 'link-button', member.joined ? '请对方离开' : '撤回邀请');
      out.type = 'button';
      out.addEventListener('click', async () => {
        if (!confirm(`${out.textContent}：${member.name}？`)) return;
        await act(() => api('/garden/remove', { id: garden.id, name: member.name }), 'settings-message');
      });
      row.append(out);
      return row;
    }) : [el('p', 'hint', '还没有邀请别人。')]));
  }

  function showItems() {
    const { kind: type } = data.garden;
    const items = data.items;
    $('map-wrap').hidden = type !== 'travel';
    $('progress').hidden = true;
    const show = { wish: showWish, travel: showTravel, dates: showDates, notes: showNotes }[type];
    const nodes = show(items);
    if (!nodes.length) nodes.push(el('p', 'empty', canWrite() ? `${kind().empty}在下面添第一条吧。` : kind().empty));
    $('items').className = `items items-${type}`;
    $('items').replaceChildren(...nodes);
  }

  function setupForm() {
    const type = data.garden.kind;
    $('item-title').placeholder = kind().title;
    $('item-title').setAttribute('aria-label', kind().title);
    $('item-body').placeholder = kind().body;
    $('item-body').setAttribute('aria-label', '内容');
    $('date-label').firstChild.textContent = `${kind().date} `;
    $('item-date').required = type === 'dates';
    $('item-body').maxLength = type === 'notes' ? 20000 : 5000;
    $('item-body').rows = type === 'notes' ? 12 : 5;
    $('done-wrap').hidden = type !== 'wish';
    $('pick-text').hidden = type !== 'travel';
    $('place-search').hidden = type !== 'travel';
    if (type === 'travel') ensureMap().picking(canWrite());
  }

  async function load() {
    data = await api(`/garden/view?id=${encodeURIComponent(gardenId)}`);
    showHead();
    showItems();
    showChildren();
    if (!$('settings').hidden) showSettings();
  }

  async function act(run, messageId) {
    $(messageId).textContent = '';
    try {
      await run();
      await load();
      return true;
    } catch (err) {
      $(messageId).textContent = errorText(err);
      return false;
    }
  }

  async function start() {
    if (!gardenId) throw Object.assign(new Error('这块园地不存在'), { status: 404 });
    await load();
    setupForm();
    if (canWrite()) resetForm();
    $('status').hidden = true;
    $('garden').hidden = false;
  }

  $('item-form').addEventListener('submit', async e => {
    e.preventDefault();
    const button = $('item-save');
    button.disabled = true;
    const body = {
      garden: data.garden.id,
      id: editing ? editing.id : undefined,
      title: $('item-title').value,
      body: $('item-body').value,
      date: $('item-date').value,
      done: $('item-done').checked,
      ...(picked || {}),
    };
    if (data.garden.kind === 'wish' && body.done && !body.date) body.date = today();
    const ok = await act(() => api('/garden/item', body), 'item-message');
    if (ok) {
      resetForm();
      $('item-message').textContent = '已保存。';
    }
    button.disabled = false;
  });

  // 搜地名：选一个结果就定好位置，标题空着的话顺便填上
  async function searchPlace() {
    const q = $('place-q').value.trim();
    if (!q) return;
    const results = $('place-results');
    const button = $('place-go');
    button.disabled = true;
    results.replaceChildren(el('p', 'hint', '正在搜…'));
    try {
      const { list } = await api(`/garden/geo?q=${encodeURIComponent(q)}`);
      results.replaceChildren(...(list.length ? list.map(place => {
        const choice = el('button', 'place-choice');
        choice.type = 'button';
        choice.setAttribute('role', 'listitem');
        choice.append(el('strong', '', place.name), el('small', '', place.label));
        choice.addEventListener('click', () => {
          picked = { lat: place.lat, lon: place.lon };
          pickedLabel = place.label;
          ensureMap().setPick(place.lat, place.lon);
          if (!$('item-title').value.trim()) $('item-title').value = place.name;
          results.replaceChildren();
          showPick();
          $('item-message').textContent = '';
        });
        return choice;
      }) : [el('p', 'hint', '没搜到。换个写法试试，外国地名用英文更准，或者直接在地图上点。')]));
    } catch (err) {
      results.replaceChildren(el('p', 'note', errorText(err)));
    }
    button.disabled = false;
  }
  $('place-go').addEventListener('click', searchPlace);
  $('place-q').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    searchPlace();
  });

  $('item-cancel').addEventListener('click', resetForm);
  $('item-delete').addEventListener('click', async () => {
    if (!editing || !confirm(`删除「${editing.title}」？删除后找不回来。`)) return;
    if (await act(() => api('/garden/item/delete', { id: editing.id }), 'item-message')) resetForm();
  });

  $('garden-form').addEventListener('submit', async e => {
    e.preventDefault();
    const ok = await act(() => api('/garden/save', {
      id: data.garden.id, title: $('garden-title').value, intro: $('garden-intro').value, public: $('garden-public').checked,
    }), 'settings-message');
    if (ok) $('settings-message').textContent = '设置已保存。';
  });

  $('invite-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('invite-name').value.trim();
    if (!name) return;
    const ok = await act(() => api('/garden/invite', { id: data.garden.id, name }), 'settings-message');
    if (ok) {
      $('invite-name').value = '';
      $('settings-message').textContent = `已邀请${name}，等对方在私人园里答应。`;
    }
  });

  $('child-form').addEventListener('submit', async e => {
    e.preventDefault();
    $('child-message').textContent = '';
    try {
      const { id } = await api('/garden/save', {
        parent: data.garden.id,
        kind: e.target.querySelector('[name=child-kind]:checked').value,
        title: $('child-title').value,
      });
      location.href = `/life/garden/?id=${id}`;
    } catch (err) {
      $('child-message').textContent = errorText(err);
    }
  });

  $('garden-delete').addEventListener('click', async () => {
    const inner = data.children.length ? '、里面的小园地' : '';
    if (!confirm(`删除「${data.garden.title}」${inner}和全部条目？删除后找不回来。`)) return;
    try {
      await api('/garden/delete', { id: data.garden.id });
      const parent = data.path[data.path.length - 1];
      location.href = parent ? `/life/garden/?id=${parent.id}` : '/life/personal/';
    } catch (err) {
      $('settings-message').textContent = errorText(err);
    }
  });

  async function answer(accept) {
    try {
      await api('/garden/answer', { id: data.garden.id, accept });
      if (!accept) return (location.href = '/life/personal/');
      await load();
      setupForm();
      resetForm();
    } catch (err) {
      alert(errorText(err));
    }
  }
  $('accept').addEventListener('click', () => answer(true));
  $('decline').addEventListener('click', () => answer(false));

  $('leave').addEventListener('click', async () => {
    if (!confirm('退出这块园地？你写过的条目会留在这里。')) return;
    try {
      await api('/garden/remove', { id: data.garden.id });
      location.href = '/life/personal/';
    } catch (err) {
      alert(errorText(err));
    }
  });

  start().catch(err => {
    const status = $('status');
    status.textContent = err.status === 404
      ? '这块园地不存在，或者只有一起写的人能看。'
      : errorText(err);
    if (err.status === 404 && !getToken()) {
      const link = el('a', '', '登录后再看');
      link.href = `/account/?back=${encodeURIComponent(location.pathname + location.search)}`;
      status.append(' ', link);
    }
  });
</script>
</body>
</html>
