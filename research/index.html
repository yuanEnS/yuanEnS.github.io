<script>
  const $ = id => document.getElementById(id);
  const PAGE = 30;
  const TOPICS_SHOWN = 8; // 主题多，先显示文章最多的几个
  // years 为空表示全部年份
  const state = { view: '', topics: new Set(), journals: new Set(), years: new Set(), fulltext: false, q: '', hideDiscussion: false, shown: PAGE, allTopics: false };
  let index = null; // papers/index.json：年份、期刊、主题，和每篇的筛选信息
  let facts = []; // 每篇一条 { year, journal, topics, discussion, reader }，算各个选项的篇数用
  const loaded = new Map(); // 年份 -> 这一年的文章（papers/<年>.json）
  const loading = new Set();
  let zhOf = {};

  // 老浏览器（比如 Kindle）没有 replaceChildren
  function fill(node, children) {
    while (node.firstChild) node.removeChild(node.firstChild);
    children.forEach(child => node.append(child));
  }

  function make(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children.filter(child => child !== null && child !== undefined && child !== false && child !== ''));
    return node;
  }

  // ---------- 地址栏：筛选条件可以分享 ----------
  let yearInUrl = false;
  function readUrl() {
    const params = new URLSearchParams(location.search);
    for (const t of params.getAll('topic')) state.topics.add(t);
    for (const j of params.getAll('journal')) state.journals.add(j);
    for (const y of params.getAll('year')) if (/^\d{4}$/.test(y)) state.years.add(Number(y));
    yearInUrl = params.has('year');
    if (params.get('year') === 'all') state.years.clear();
    state.fulltext = params.get('fulltext') === '1';
    state.q = params.get('q') || '';
    state.hideDiscussion = params.get('discussion') === 'hide';
    // 带了筛选条件的旧链接，直接进期刊文章
    const filtered = state.topics.size || state.journals.size || state.q || state.hideDiscussion || state.fulltext || yearInUrl;
    state.view = ['books', 'papers', 'shelf'].includes(params.get('view')) ? params.get('view') : filtered ? 'papers' : '';
  }

  function writeUrl() {
    const params = new URLSearchParams();
    if (state.view) params.set('view', state.view);
    if (state.view !== 'papers') {
      history.replaceState(null, '', state.view ? `?view=${state.view}` : location.pathname);
      return;
    }
    if (state.years.size) for (const y of [...state.years].sort((a, b) => b - a)) params.append('year', y);
    else if (index) params.set('year', 'all'); // 数据还没下载时年份还没定，先不写
    for (const t of state.topics) params.append('topic', t);
    for (const j of state.journals) params.append('journal', j);
    if (state.fulltext) params.set('fulltext', '1');
    if (state.q) params.set('q', state.q);
    if (state.hideDiscussion) params.set('discussion', 'hide');
    history.replaceState(null, '', `?${params}`);
  }

  // ---------- 筛选 ----------
  function words() {
    return state.q.toLowerCase().split(/\s+/).filter(Boolean);
  }

  function yearOf(paper) {
    return paper.date ? Number(paper.date.slice(0, 4)) : 0;
  }

  // paper 可以是完整的文章，也可以是 facts 里的一条（没有标题摘要，不看搜索词）
  function matches(paper, { skip } = {}) {
    if (state.hideDiscussion && paper.discussion) return false;
    if (skip !== 'year' && state.years.size && !state.years.has(paper.year)) return false;
    if (skip !== 'topic' && state.topics.size && !paper.topics.some(t => state.topics.has(t))) return false;
    if (skip !== 'journal' && state.journals.size && !state.journals.has(paper.journal)) return false;
    if (skip !== 'fulltext' && state.fulltext && !paper.reader) return false;
    const terms = words();
    if (terms.length && paper.title !== undefined) {
      const text = paper._text || (paper._text = `${paper.title} ${paper.authors} ${paper.abstract}`.toLowerCase());
      if (!terms.every(term => text.includes(term))) return false;
    }
    return true;
  }

  const wantedYears = () => (state.years.size ? [...state.years] : index.years.map(y => y.year)).sort((a, b) => b - a);
  const ready = () => wantedYears().every(y => loaded.has(y));

  // 每个选项旁边的数字：在其他条件不变时，选上它能看到多少篇。
  // 没有搜索词时按 facts 算（全部年份都准）；有搜索词时只能在已经下载的年份里算，没下载的年份显示「·」
  function counts(skip, key) {
    const result = new Map();
    const pool = words().length ? [...loaded.values()].flat() : facts;
    for (const paper of pool) {
      if (!matches(paper, { skip })) continue;
      for (const value of key(paper)) result.set(value, (result.get(value) || 0) + 1);
    }
    return result;
  }

  function chip(label, value, set, count, title) {
    const pressed = set.has(value);
    const unknown = count === null;
    const button = make('button', { type: 'button', className: 'chip', title: title || '' }, label, make('small', {}, unknown ? '·' : String(count || 0)));
    button.setAttribute('aria-pressed', String(pressed));
    button.disabled = !unknown && !count && !pressed;
    button.addEventListener('click', () => {
      if (set.has(value)) set.delete(value);
      else set.add(value);
      state.shown = PAGE;
      update();
    });
    return button;
  }

  function drawFacets() {
    const searching = words().length > 0;
    const yearCounts = counts('year', p => [p.year]);
    const yearChips = index.years.map(({ year }) => chip(String(year), year, state.years,
      searching && !loaded.has(year) ? null : yearCounts.get(year), `${year} 年发表的文章`));
    const all = make('button', { type: 'button', className: 'chip more' }, state.years.size ? '全部年份' : '只看最新一年');
    all.title = state.years.size ? '全部年份的文章要多下载一些，大约 8 MB' : '';
    all.addEventListener('click', () => {
      if (state.years.size) state.years.clear();
      else state.years.add(index.years[0].year);
      state.shown = PAGE;
      update();
    });
    fill($('years'), [...yearChips, all]);

    const topicCounts = counts('topic', p => p.topics);
    // 文章多的主题在前，「Other」总在最后
    const ordered = [...index.topics].sort((a, b) => (a.code === 'Other') - (b.code === 'Other')
      || (topicCounts.get(b.code) || 0) - (topicCounts.get(a.code) || 0));
    const visible = state.allTopics ? ordered
      : ordered.filter((t, i) => i < TOPICS_SHOWN || state.topics.has(t.code));
    const topicChips = visible.map(t => chip(t.code, t.code, state.topics, topicCounts.get(t.code), t.zh));
    if (ordered.length > visible.length || state.allTopics) {
      const more = make('button', { type: 'button', className: 'chip more' }, state.allTopics ? '收起' : `更多主题（${ordered.length - visible.length}）`);
      more.addEventListener('click', () => {
        state.allTopics = !state.allTopics;
        drawFacets();
      });
      topicChips.push(more);
    }
    fill($('topics'), topicChips);

    const journalCounts = counts('journal', p => [p.journal]);
    fill($('journals'), index.journals.map(j => chip(j.code, j.code, state.journals, journalCounts.get(j.code), j.name)));

    const textCount = counts('fulltext', p => (p.reader ? ['fulltext'] : [])).get('fulltext') || 0;
    const flag = new Set(state.fulltext ? ['fulltext'] : []);
    const textChip = chip('有原文', 'fulltext', flag, textCount, '可以在本站直接读全文的文章');
    textChip.addEventListener('click', () => {
      state.fulltext = !state.fulltext;
      state.shown = PAGE;
      update();
    });
    fill($('extras'), [textChip]);
  }

  // ---------- 列表 ----------
  function highlight(text) {
    const terms = words().filter(term => term.length > 1);
    if (!terms.length) return [text];
    const pattern = new RegExp(`(${terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
    return text.split(pattern).map((part, i) => (i % 2 ? make('mark', {}, part) : part));
  }

  function shortAuthors(authors) {
    const list = authors.split(/\s*[,;，]\s*|\s+and\s+/).filter(Boolean);
    return list.length > 8 ? `${list.slice(0, 6).join(', ')} 等 ${list.length} 人` : list.join(', ');
  }

  function label(text, className, onClick, title) {
    const node = make('button', { type: 'button', className: `label ${className}`, title: title || '' }, text);
    if (onClick) node.addEventListener('click', onClick);
    return node;
  }

  function only(set, value) {
    return () => {
      set.clear();
      set.add(value);
      state.shown = PAGE;
      // 从书上点的标签：切到期刊文章，数据下载好以后按这个条件显示
      if (state.view !== 'papers' || !index) {
        setView('papers');
        return;
      }
      update();
      $('count').scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  function paperNode(paper) {
    const journalName = (index.journals.find(j => j.code === paper.journal) || {}).name || paper.journal;
    const when = `${paper.date ? `发表于 ${paper.date}` : ''}${paper.week && paper.week !== paper.date ? ` · 收录于 ${paper.week}` : ''}`;
    const meta = make('p', { className: 'paper-meta' },
      label(paper.journal, 'journal', only(state.journals, paper.journal), `只看 ${journalName}`),
      ...paper.topics.map(t => label(t, 'topic', only(state.topics, t), `只看「${zhOf[t] || t}」`)),
      paper.discussion ? make('span', { className: 'label kind' }, '讨论 / 评论') : null,
      paper.reader ? make('a', { className: 'label free', href: paper.reader, title: '在本站读全文' }, '有原文') : null,
      make('span', { className: 'week' }, when));
    const title = make('h2', {}, make('a', { href: paper.link, target: '_blank', rel: 'noopener' }, ...highlight(paper.title)));
    const node = make('article', { className: 'paper' }, meta, title);
    if (paper.authors) node.append(make('p', { className: 'authors' }, ...highlight(shortAuthors(paper.authors))));
    if (paper.reader) node.append(make('p', { className: 'book-links' }, make('a', { href: paper.reader }, '在本站读原文 →')));
    if (paper.abstract) {
      const details = make('details', {}, make('summary', {}, paper.abstractZh ? '中文概述' : '摘要'));
      details.addEventListener('toggle', () => {
        if (!details.open || details.dataset.filled) return;
        details.dataset.filled = '1';
        details.append(make('p', { className: 'abstract', lang: paper.abstractZh ? 'zh-CN' : 'en' }, ...highlight(paper.abstract)));
        if (paper.abstractZh) details.append(make('p', { className: 'abstract-note' }, '周报整理时没拿到原文摘要，这是中文概述。原文请点标题。'));
      });
      // 搜到的词在摘要里时，直接展开
      const terms = words();
      if (terms.length && terms.some(term => paper.abstract.toLowerCase().includes(term))) {
        details.open = true;
        details.dispatchEvent(new Event('toggle'));
      }
      node.append(details);
    } else {
      node.append(make('p', { className: 'no-abstract' }, '摘要没有收录，点标题看原文。'));
    }
    node.append(marksNode({ item: paper.id, title: paper.title, journal: paper.journal, date: paper.date || '', link: paper.reader || paper.link }));
    return node;
  }

  // 下载选中的年份里还没下载的
  function loadYears() {
    for (const year of wantedYears()) {
      if (loaded.has(year) || loading.has(year)) continue;
      loading.add(year);
      fetch(`/research/papers/${year}.json`).then(res => {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      }).then(json => {
        json.papers.forEach(p => { p.year = yearOf(p); });
        loaded.set(year, json.papers);
      }).catch(() => {
        $('count').textContent = `${year} 年的文章打不开，请稍后再试。`;
      }).then(() => {
        loading.delete(year);
        if (state.view === 'papers') update();
      });
    }
  }

  function update() {
    writeUrl();
    loadYears();
    drawFacets();
    const filtered = state.topics.size || state.journals.size || state.q || state.hideDiscussion || state.fulltext;
    const total = facts.filter(p => matches(p)).length; // 不算搜索词时的篇数
    const yearText = state.years.size ? [...state.years].sort((a, b) => b - a).join('、') + ' 年' : '全部年份';
    $('clear').hidden = !filtered && state.years.size === 1 && state.years.has(index.years[0].year);
    if (!ready()) {
      const left = wantedYears().filter(y => !loaded.has(y)).length;
      $('count').textContent = `${yearText}共 ${total} 篇，正在下载（还有 ${left} 年）…`;
      fill($('list'), []);
      $('more').hidden = true;
      return;
    }
    const list = wantedYears().flatMap(y => loaded.get(y)).filter(p => matches(p));
    $('count').textContent = state.q ? `${yearText}找到 ${list.length} 篇` : `${yearText}${filtered ? '符合条件的' : '共'} ${list.length} 篇，新的在前`;
    fill($('list'), list.slice(0, state.shown).map(paperNode));
    if (!list.length) {
      $('list').append(make('p', { className: 'empty' }, state.q && state.years.size
        ? '这几年里没有找到。可以点「全部年份」，或者用页面上方的全站搜索。' : '没有符合条件的文章，换个条件试试。'));
    }
    $('more').hidden = list.length <= state.shown;
    $('more').textContent = `再看 ${Math.min(PAGE, list.length - state.shown)} 篇（还有 ${list.length - state.shown} 篇）`;
  }

  // ---------- 经典书籍 ----------
  // 本站的在线阅读在当前页打开，外站的链接开新页
  function linkProps(url) {
    return url.startsWith('/') ? { href: url } : { href: url, target: '_blank', rel: 'noopener' };
  }

  function bookNode(book) {
    const first = book.links && book.links[0];
    const tags = make('p', { className: 'paper-meta' },
      ...book.topics.map(t => {
        const tag = make('a', { className: 'label', href: `?topic=${encodeURIComponent(t)}`, title: `看「${t}」的期刊文章` }, t);
        tag.addEventListener('click', e => {
          e.preventDefault();
          only(state.topics, t)();
        });
        return tag;
      }),
      book.level ? make('span', { className: 'label kind' }, book.level) : null,
      book.free ? make('span', { className: 'label free' }, '可免费阅读') : null,
      book.reader ? make('a', { className: 'label free', href: book.reader, title: '在本站分章读全文' }, '有原文') : null);
    const by = [book.authors.join(', '), book.publisher, book.year].filter(Boolean).join(' · ');
    return make('article', { className: 'book' }, tags,
      make('h3', {}, first ? make('a', linkProps(first.url), book.title) : book.title),
      make('p', { className: 'book-by' }, by),
      book.intro ? make('p', { className: 'book-intro' }, book.intro) : null,
      make('p', { className: 'book-links' }, ...(book.links || []).map(link => make('a', linkProps(link.url), link.label))),
      marksNode({ item: `book:${book.id}`, title: book.title, journal: '书', date: String(book.year || ''), link: book.reader || (first && first.url) || '/research/?view=books' }));
  }

  let booksLoaded = false;
  let booksData = null;
  function loadBooks() {
    if (booksLoaded) return;
    booksLoaded = true;
    fetch('/research/books.json').then(res => res.json()).then(({ books }) => {
      booksData = books || [];
      fill($('books'), books && books.length ? books.map(bookNode) : [make('p', { className: 'empty' }, '还没有书。')]);
    }).catch(() => {
      booksLoaded = false;
      fill($('books'), [make('p', { className: 'empty' }, '书目暂时打不开，请稍后再试。')]);
    });
  }

  // 先选「经典书籍」或「期刊文章」，选了才显示对应的内容；期刊文章的数据比较大，选了才下载
  let indexLoaded = false;
  function setView(view, scroll = true) {
    state.view = view;
    document.querySelectorAll('.choice').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
    $('books-view').hidden = view !== 'books';
    $('papers-view').hidden = view !== 'papers';
    $('shelf-view').hidden = view !== 'shelf';
    // 书架的数据先下载，下好了把书、文章上的星和阅读状态补上
    loadShelf().then(() => {
      if (state.view === 'shelf') drawShelf();
      else if (state.view === 'papers' && index) update();
      else if (state.view === 'books' && booksData) fill($('books'), booksData.map(bookNode));
    });
    if (view === 'books') loadBooks();
    if (view === 'papers' && !indexLoaded) {
      indexLoaded = true;
      loadIndex();
    } else if (view === 'papers' && index) update();
    writeUrl();
    if (scroll && view) $(`${view}-title`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.querySelectorAll('.choice').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));

  // ---------- 书架：打星、阅读状态、笔记（存在服务器上，只有自己看得到） ----------
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://127.0.0.1:8787/api' : 'https://api.yuanens.com/api';
  const STATUS = { want: '想读', reading: '在读', done: '读完' };
  const shelf = { promise: null, ok: false, problem: '', items: new Map() };
  function token() {
    try {
      return JSON.parse(localStorage.getItem('xiangqi:token')) || ''; // 和账号页、游戏共用的登录令牌
    } catch (e) {
      return '';
    }
  }
  async function shelfApi(path, body) {
    const res = await fetch(API + path, {
      method: body ? 'POST' : 'GET',
      headers: { 'content-type': 'application/json', Authorization: `Bearer ${token()}` },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || '出错了'), { status: res.status });
    return data;
  }
  function loadShelf() {
    if (!shelf.promise) {
      shelf.promise = (async () => {
        if (!token()) {
          shelf.problem = 'login';
          return;
        }
        try {
          const { items } = await shelfApi('/shelf');
          items.forEach(item => shelf.items.set(item.item, item));
          shelf.ok = true;
        } catch (err) {
          shelf.problem = err.status === 401 ? 'login' : err.status === 403 ? 'guest' : 'down';
        }
      })();
    }
    return shelf.promise;
  }
  // 笔记里的公式：和生活园一样，$...$ 嵌在句子里，$$...$$ 单独一行，\$ 是普通的美元符号。
  // 「花了 $5，又花了 $6」不算公式：结束的 $ 后面紧跟数字、或者两头挨着空格的都不算。
  const MATH = /\\\$|\$\$([\s\S]+?)\$\$|\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g;
  function noteNodes(text) {
    const parts = [];
    let last = 0, found;
    MATH.lastIndex = 0;
    while ((found = MATH.exec(text))) {
      const display = !!found[1];
      // 单独一行的公式自己就占一行，紧挨着它的换行去掉，免得上下多出空行
      if (found.index > last) parts.push(display ? text.slice(last, found.index).replace(/\n$/, '') : text.slice(last, found.index));
      if (found[0] === '\\$') parts.push('$');
      else {
        const tex = (found[1] || found[2]).trim();
        const span = make('span', { className: `math${display ? ' display' : ''}` }, tex);
        span.dataset.tex = tex;
        parts.push(span);
      }
      last = MATH.lastIndex;
      if (display && text[last] === '\n') last++;
    }
    if (last < text.length) parts.push(text.slice(last));
    return parts;
  }
  // KaTeX 只在笔记里真有公式时才加载（和生活园同一个版本）
  const KATEX = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11';
  let katexReady = null;
  function loadKatex() {
    if (window.katex) return Promise.resolve();
    if (!katexReady) {
      katexReady = new Promise((resolve, reject) => {
        const css = make('link', { rel: 'stylesheet', href: `${KATEX}/katex.min.css` });
        document.head.append(css);
        const script = make('script', { src: `${KATEX}/katex.min.js` });
        script.onload = resolve;
        script.onerror = () => {
          katexReady = null;
          reject(new Error('公式排版没加载出来'));
        };
        document.head.append(script);
      });
    }
    return katexReady;
  }
  async function renderMath(root) {
    const nodes = [...root.querySelectorAll('.math[data-tex]')];
    if (!nodes.length) return;
    try {
      await loadKatex();
    } catch (e) {
      return; // 加载不了就显示公式原文
    }
    for (const node of nodes) {
      window.katex.render(node.dataset.tex, node, { displayMode: node.classList.contains('display'), throwOnError: false, output: 'htmlAndMathml' });
    }
  }

  function shelfProblem() {
    const msg = make('p', { className: 'marks-msg' });
    if (shelf.problem === 'guest') msg.append('游客账号不能用书架，', make('a', { href: '/account/' }, '用邮箱或 Google 登录'), '以后就能收藏和记笔记。');
    else if (shelf.problem === 'down') msg.append('书架暂时连不上，请稍后再试。');
    else msg.append(make('a', { href: '/account/' }, '登录'), '以后，可以收藏文章、标阅读状态、写笔记，存在自己的书架上。');
    return msg;
  }
  // entry：{ item, title, journal, date, link }，书架上存一份，书架页不用再下载整年的文章
  function marksNode(entry) {
    const box = make('div', {});
    box.dataset.shelfItem = entry.item;
    let editing = false, message = null;
    const draw = () => {
      const mine = shelf.items.get(entry.item) || {};
      const button = (text, pressed, className, onClick, title) => {
        const b = make('button', { type: 'button', className: `mark ${className || ''}`, title: title || '' }, text);
        b.setAttribute('aria-pressed', String(!!pressed));
        b.addEventListener('click', onClick);
        return b;
      };
      const row = make('div', { className: 'marks' },
        button(mine.starred ? '★ 已收藏' : '☆ 收藏', mine.starred, 'star', () => change({ starred: !mine.starred })),
        make('span', { className: 'sep' }),
        ...Object.entries(STATUS).map(([key, name]) => button(name, mine.status === key, '', () => change({ status: mine.status === key ? null : key }),
          mine.status === key ? `再点一下取消「${name}」` : `标成「${name}」`)),
        make('span', { className: 'sep' }),
        button(mine.note ? '改笔记' : '写笔记', editing, '', () => {
          if (!shelf.ok) return showProblem();
          editing = !editing;
          draw();
        }));
      const parts = [row];
      if (message) parts.push(message);
      if (mine.note && !editing) {
        const when = mine.status === 'done' && mine.done_at ? ` · ${new Date(mine.done_at).toLocaleDateString('zh-CN')} 读完` : '';
        const note = make('p', { className: 'my-note' }, make('small', {}, `我的笔记${when}`), ...noteNodes(mine.note));
        renderMath(note);
        parts.push(note);
      }
      if (editing) {
        const area = make('textarea', { maxLength: 600, placeholder: '一两句读后感：讲了什么、哪里有用、想到了什么……（只有自己看得到）' });
        area.value = mine.note || '';
        const left = make('span', {});
        // 写了公式就在下面预览排版的样子
        const preview = make('div', { className: 'note-preview' });
        let typing = null;
        const refresh = () => {
          left.textContent = `${[...area.value].length} / 600`;
          clearTimeout(typing);
          typing = setTimeout(() => {
            const nodes = noteNodes(area.value);
            preview.hidden = !nodes.some(n => n.nodeType === 1);
            fill(preview, [make('small', {}, '预览'), ...nodes]);
            renderMath(preview);
          }, 250);
        };
        area.addEventListener('input', refresh);
        refresh();
        const saveButton = make('button', { type: 'button', className: 'mark' }, '保存');
        saveButton.addEventListener('click', () => change({ note: area.value }).then(ok => { if (ok) { editing = false; draw(); } }));
        const cancel = make('button', { type: 'button', className: 'mark' }, '取消');
        cancel.addEventListener('click', () => { editing = false; draw(); });
        const help = make('span', { className: 'note-help' }, '可以写公式：', make('code', {}, '$\\hat\\theta$'), ' 嵌在句子里，',
          make('code', {}, '$$\\sum_i x_i$$'), ' 单独一行；', make('code', {}, '\\$'), ' 是普通的美元符号。');
        parts.push(make('div', { className: 'note-edit' }, area, help, preview, make('div', { className: 'row' }, saveButton, cancel, left)));
        setTimeout(() => area.focus(), 0);
      }
      fill(box, parts);
    };
    box.redraw = () => draw();
    const showProblem = () => {
      message = shelfProblem();
      draw();
    };
    const change = async changes => {
      await loadShelf();
      if (!shelf.ok) {
        showProblem();
        return false;
      }
      try {
        const result = await shelfApi('/shelf/save', { ...entry, ...changes });
        if (result.removed) shelf.items.delete(entry.item);
        else shelf.items.set(entry.item, result.item);
        message = null;
        draw();
        // 同一篇在页面上可能不止一处（列表重画过、书架页里也有），都按新的状态重画
        document.querySelectorAll('[data-shelf-item]').forEach(other => {
          if (other !== box && other.dataset.shelfItem === entry.item && other.redraw) other.redraw();
        });
        if (state.view === 'shelf') drawShelf();
        return true;
      } catch (err) {
        message = make('p', { className: 'marks-msg' }, err.message || '没存上，请稍后再试');
        draw();
        return false;
      }
    };
    draw();
    return box;
  }

  function drawShelf() {
    if (!shelf.ok) {
      fill($('shelf'), [shelf.promise ? shelfProblem() : make('p', { className: 'empty' }, '正在打开…')]);
      return;
    }
    const items = [...shelf.items.values()];
    const doneYears = [...new Set(items.filter(i => i.done_at).map(i => new Date(i.done_at).getFullYear()))].sort((a, b) => b - a);
    const thisYear = new Date().getFullYear();
    if (!state.shelfYear) state.shelfYear = thisYear;
    const doneIn = items.filter(i => i.done_at && new Date(i.done_at).getFullYear() === state.shelfYear);
    const count = key => items.filter(i => (key === 'starred' ? i.starred : i.status === key)).length;
    const stat = (n, text) => make('div', { className: 'stat' }, make('b', {}, String(n)), make('span', {}, text));
    const stats = make('div', { className: 'shelf-stats' },
      stat(doneIn.length, `${state.shelfYear} 年读完`), stat(count('reading'), '在读'), stat(count('want'), '想读'), stat(count('starred'), '收藏'));
    // 每个月读完几篇
    const perMonth = Array(12).fill(0);
    doneIn.forEach(i => { perMonth[new Date(i.done_at).getMonth()]++; });
    const top = Math.max(1, ...perMonth);
    const bars = make('div', { className: 'months', title: `${state.shelfYear} 年每个月读完的篇数` },
      ...perMonth.map((n, m) => {
        const bar = make('i', { title: `${m + 1} 月读完 ${n} 篇` });
        bar.style.height = `${Math.round((n / top) * 86) + (n ? 4 : 0)}px`;
        return bar;
      }));
    const labels = make('div', { className: 'months-labels' }, ...perMonth.map((n, m) => make('span', {}, `${m + 1}月${n ? ` ${n}` : ''}`)));
    const years = make('div', { className: 'chips' }, ...[...new Set([thisYear, ...doneYears])].sort((a, b) => b - a).map(y => {
      const b = make('button', { type: 'button', className: 'chip' }, `${y} 年`);
      b.setAttribute('aria-pressed', String(y === state.shelfYear));
      b.addEventListener('click', () => { state.shelfYear = y; drawShelf(); });
      return b;
    }));
    const filters = [['all', '全部'], ['starred', '收藏'], ['want', '想读'], ['reading', '在读'], ['done', '读完']];
    if (!state.shelfFilter) state.shelfFilter = 'all';
    const tabs = make('div', { className: 'chips' }, ...filters.map(([key, name]) => {
      const n = key === 'all' ? items.length : count(key);
      const b = make('button', { type: 'button', className: 'chip' }, name, make('small', {}, String(n)));
      b.setAttribute('aria-pressed', String(key === state.shelfFilter));
      b.addEventListener('click', () => { state.shelfFilter = key; drawShelf(); });
      return b;
    }));
    const shown = items.filter(i => state.shelfFilter === 'all' || (state.shelfFilter === 'starred' ? i.starred : i.status === state.shelfFilter));
    const list = shown.map(i => make('article', { className: 'shelf-item' },
      make('p', { className: 'paper-meta' },
        i.journal ? make('span', { className: 'label journal' }, i.journal) : null,
        i.status ? make('span', { className: 'label kind' }, STATUS[i.status]) : null,
        make('span', { className: 'week' }, i.date ? `发表于 ${i.date}` : '')),
      make('h3', {}, make('a', linkProps(i.link || '#'), i.title)),
      marksNode({ item: i.item, title: i.title, journal: i.journal, date: i.date, link: i.link })));
    fill($('shelf'), [
      make('fieldset', { className: 'facet' }, make('legend', {}, '读完的篇数'), years), bars, labels, stats,
      make('fieldset', { className: 'facet' }, make('legend', {}, '书架上的'), tabs),
      ...(list.length ? list : [make('p', { className: 'empty' }, items.length
        ? '这一栏还没有。' : '书架还是空的。在「经典书籍」「期刊文章」里给文章打星、标「想读 / 在读 / 读完」，就会出现在这里。')]),
    ]);
  }

  // ---------- 开始 ----------
  readUrl();
  $('q').value = state.q;
  $('hide-discussion').checked = state.hideDiscussion;
  let typing;
  $('q').addEventListener('input', () => {
    clearTimeout(typing);
    typing = setTimeout(() => {
      state.q = $('q').value.trim();
      state.shown = PAGE;
      update();
    }, 200);
  });
  $('hide-discussion').addEventListener('change', () => {
    state.hideDiscussion = $('hide-discussion').checked;
    state.shown = PAGE;
    update();
  });
  $('clear').addEventListener('click', () => {
    state.topics.clear();
    state.journals.clear();
    state.years.clear();
    state.years.add(index.years[0].year);
    state.fulltext = false;
    state.q = '';
    $('q').value = '';
    state.hideDiscussion = false;
    $('hide-discussion').checked = false;
    state.shown = PAGE;
    update();
  });
  $('more').addEventListener('click', () => {
    state.shown += PAGE;
    update();
  });

  function loadIndex() {
    fetch('/research/papers/index.json').then(res => {
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }).then(json => {
      index = json;
      zhOf = {};
      index.topics.forEach(t => { zhOf[t.code] = t.zh; });
      facts = index.rows.map(([year, j, mask, flags]) => ({
        year, journal: index.journals[j].code,
        topics: index.topics.filter((t, i) => mask & (2 ** i)).map(t => t.code),
        discussion: !!(flags & 1), reader: !!(flags & 2),
      }));
      // 没指定年份时先看最新一年，数据小，打开快
      if (!yearInUrl) state.years.add(index.years[0].year);
      const names = index.journals.map(j => j.code).join('、');
      const first = index.years[index.years.length - 1].year;
      $('about').textContent = `收录 ${first} 年以来的 ${facts.length} 篇，期刊：${names}。`
        + `每周的新文章更新到 ${index.updated} 的周报。年份按网上首发的日期算，只知道年份的就只写年份。`
        + '主题标签按标题和摘要里的词自动归类，一篇最多三个，难免有不准的地方。点文章上的标签，可以只看这一类。'
        + '页面里的搜索框只搜选中的年份，想跨年份找，用页面上方的全站搜索。';
      update();
    }).catch(() => {
      $('count').textContent = '文章列表打不开。';
      $('count').append(' 请看', make('a', { href: '/research/lite/' }, '简易版'), '。');
    });
  }

  setView(state.view, false);
</script>
</body>
</html>
