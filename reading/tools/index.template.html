<style>
  .facet { margin: 0 0 14px; padding: 0; border: 0; }
  .facet legend { margin-bottom: 8px; padding: 0; color: var(--muted); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .page .chip {
    padding: 4px 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card);
    color: var(--soft); font: 16px/1.6 var(--kai); cursor: pointer;
  }
  .page .chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: #FFF4E6; }
  .count { margin: 18px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 15px; }
  .book { margin-top: 16px; padding: 18px 20px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); }
  .book h2 { margin: 6px 0 2px; font: 24px/1.35 "Iowan Old Style", "Palatino Linotype", Georgia, var(--kai); font-weight: 400; }
  .book h2 a { color: var(--text); text-decoration: none; }
  .book h2 a:hover { color: var(--primary); text-decoration: underline; }
  .book-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
  .label { display: inline-block; padding: 0 8px; border: 1px solid var(--rule); border-radius: 4px; color: var(--soft); font-size: 14px; line-height: 22px; }
  .label.kind { border-style: dashed; }
  .book-by { margin: 0; color: var(--muted); font-size: 16px; }
  .book-intro { margin: 10px 0 0; color: var(--soft); font-size: 17px; line-height: 1.85; }
  .book-size { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .book-links { margin: 8px 0 0; font-size: 16px; }
  .book-links a { color: var(--primary); }
  .about { margin-top: 36px; color: var(--muted); font-size: 14px; line-height: 1.8; }
</style>
</head>
<body>
<div class="page">
<nav class="top"><a href="/">← 首页</a><a href="/research/">研究园</a></nav>
<header class="masthead">
  <span class="seal" aria-hidden="true">读</span>
  <h1>阅读园</h1>
  <p>英文经典名著，一章一页在线读。手机、电脑、Kindle 都能看。</p>
</header>

<section aria-label="筛选">
  <fieldset class="facet"><legend>类别</legend><div class="chips">{{GENRES}}</div></fieldset>
  <fieldset class="facet"><legend>难度</legend><div class="chips">{{LEVELS}}</div></fieldset>
</section>
<p class="count" id="count" role="status" aria-live="polite">共 {{COUNT}} 本</p>

<main id="books">
{{BOOKS}}
</main>

<p class="about">这些书都已进入公有领域，文本来自 <a href="https://standardebooks.org/">Standard Ebooks</a> 的精校版（CC0）。难度是按中国读者大致估的：入门的句子短、故事抓人；进阶的是长篇，语言更讲究。读完的时间按母语读者每分钟 200 词估算，读外语可以按两倍算。</p>
<footer class="foot"><a href="/">首页</a> · <a href="/research/">研究园</a> · <a href="/life/">生活园</a> · <a href="/games/">游戏园</a></footer>
</div>
<script>
  // 按类别、难度筛选。同一组里选多个是「或」，两组之间是「且」。没有 JavaScript 时显示全部
  (function () {
    var chips = document.querySelectorAll('.chip');
    var books = document.querySelectorAll('.book');
    function picked(name) {
      var out = [];
      for (var i = 0; i < chips.length; i++) {
        if (chips[i].getAttribute('data-' + name) && chips[i].getAttribute('aria-pressed') === 'true') out.push(chips[i].getAttribute('data-' + name));
      }
      return out;
    }
    function update() {
      var genres = picked('genre'), levels = picked('level'), shown = 0;
      for (var i = 0; i < books.length; i++) {
        var mine = books[i].getAttribute('data-genres').split(' ');
        var okGenre = !genres.length || genres.some(function (g) { return mine.indexOf(g) >= 0; });
        var okLevel = !levels.length || levels.indexOf(books[i].getAttribute('data-level')) >= 0;
        books[i].style.display = okGenre && okLevel ? '' : 'none';
        if (okGenre && okLevel) shown++;
      }
      document.getElementById('count').textContent = genres.length || levels.length
        ? '找到 ' + shown + ' 本（共 ' + books.length + ' 本）' : '共 ' + books.length + ' 本';
    }
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function () {
        this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        update();
      });
    }
  })();
</script>
</body>
